<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C788"/>
      <stop offset="50%" stop-color="#C4A777"/>
      <stop offset="100%" stop-color="#8F7142"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#1C1917"/>
  <circle cx="50" cy="50" r="40" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.6"/>
